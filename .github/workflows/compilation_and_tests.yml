name: Compilation and tests check for HeroCtrl
permissions:
  contents: write
on:
  push:
    branches-ignore:
      - 'ga-ignore-**'
  pull_request:
    branches-ignore:
      - 'ga-ignore-**'

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.changes.outputs.app }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Check for app changes"
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            app:
              - 'app/**'
  
  check_tests_changes:
    runs-on: ubuntu-latest
    outputs:
      tests_changed: ${{ steps.changes.outputs.tests }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Check for test changes"
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            tests:
              - 'tests/**'

  build:
    needs: check_changes
    runs-on: ubuntu-latest
    if: needs.check_changes.outputs.app_changed == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Set up Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
      - name: "Install dependencies"
        run: flutter pub get
      - name: "Analyze code"
        run: flutter analyze
      - name: "Build APK"
        run: flutter build apk --release

  test:
    needs: check_tests_changes
    runs-on: ubuntu-latest
    if: needs.check_tests_changes.outputs.tests_changed == 'true'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Set up Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
      - name: "Install dependencies"
        run: flutter pub get
      - name: "Analyze code"
        run: flutter analyze
      - name: "Run tests"
        run: flutter test
