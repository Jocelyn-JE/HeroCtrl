name: heroctrl
description: "This is a mobile app to remotely control a GoPro Hero 3 camera"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.5.0
  logging: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.7
  wifi_scan: ^0.4.1+2
  wifi_iot: ^0.3.19+2
  intl: any
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
